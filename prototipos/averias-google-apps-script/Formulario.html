<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f5f3ee; --card:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e3dfd6;
          --acc:#d4a017; --acc-ink:#1c1b19; --ok:#1f7a4d; --err:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:#1c1b19; color:#fff; padding:18px 16px 16px; }
  header small { color:#d9c58a; letter-spacing:.06em; text-transform:uppercase; font-size:11px; font-weight:600; }
  header h1 { margin:4px 0 0; font-size:21px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:14px; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  .opc { font-weight:400; color:var(--muted); }
  input, select, textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--line);
         border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--acc); border-color:var(--acc); }
  textarea { min-height:80px; resize:vertical; }
  .fila { display:grid; grid-template-columns:1fr 1.3fr; gap:10px; }
  .foto-box { border:1.5px dashed var(--line); border-radius:10px; padding:12px; text-align:center; color:var(--muted); font-size:14px; }
  .foto-box img { max-width:100%; max-height:220px; border-radius:8px; display:block; margin:0 auto 8px; }
  button { width:100%; font:inherit; font-weight:700; padding:15px; border:0; border-radius:12px;
           background:var(--acc); color:var(--acc-ink); cursor:pointer; }
  button:disabled { opacity:.6; }
  .sec { background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:600; margin-top:10px; }
  .msg { padding:12px; border-radius:10px; font-size:14px; margin-top:12px; display:none; }
  .msg.err { display:block; background:#fde8e6; color:var(--err); }
  .exito { text-align:center; padding:28px 16px; }
  .exito .check { width:64px; height:64px; border-radius:50%; background:#dff3e8; color:var(--ok);
                  font-size:34px; line-height:64px; margin:0 auto 12px; }
  .exito .id { font:700 22px ui-monospace,Menlo,monospace; margin:6px 0 14px; }
  .resumen { text-align:left; font-size:14px; color:var(--muted); background:var(--bg); border-radius:10px; padding:12px; }
  .oculto { display:none !important; }
  /* Buscador de SKU */
  .buscador { position:relative; }
  .buscador input { padding-left:38px; }
  .buscador svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); }
  .lista-sku { margin-top:8px; max-height:300px; overflow-y:auto; border:1px solid var(--line); border-radius:10px;
               -webkit-overflow-scrolling:touch; background:#fff; }
  .grupo { position:sticky; top:0; background:#f0ede6; font-size:11px; font-weight:700; letter-spacing:.05em;
           color:var(--muted); padding:6px 12px; text-transform:uppercase; }
  .op { display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; background:#fff; color:var(--ink);
        border:0; border-bottom:1px solid var(--line); border-radius:0; padding:12px; font-weight:400; font-size:15px; }
  .op:active, .op:hover { background:#fbf6e6; }
  .op code { font:700 13px ui-monospace,Menlo,monospace; color:#8a5a00; flex:0 0 auto; }
  .op mark { background:#fde68a; color:inherit; border-radius:3px; }
  .info { font-size:13px; color:var(--muted); padding:10px 12px; }
  .elegido { display:flex; justify-content:space-between; align-items:center; gap:10px; border:2px solid var(--acc);
             background:#fffaeb; border-radius:10px; padding:10px 12px; }
  .elegido b { display:block; font-size:15px; }
  .elegido span { font-size:12px; color:var(--muted); }
  .elegido button, .link { width:auto; background:transparent; color:#8a5a00; padding:6px; font-weight:700; font-size:14px; }
  .link { padding:8px 0 0; text-decoration:underline; font-weight:600; }
  /* Botón Cajas / Unidades */
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:#efece5; border-radius:12px; padding:4px; gap:4px; }
  .seg button { background:transparent; color:var(--ink); font-weight:600; padding:12px 6px; border-radius:9px; }
  .seg button[aria-pressed="true"] { background:#1c1b19; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .equiv { font-size:13px; color:var(--muted); margin-top:6px; min-height:1.2em; }
</style>
</head>
<body>
<header>
  <small>BU CAM | La Constancia · Distribución</small>
  <h1>Registro de averías</h1>
</header>

<main>
  <form id="f" class="card" novalidate>
    <div class="fila">
      <div><label for="fechaJornada">Fecha</label><input type="date" id="fechaJornada" required></div>
      <div><label for="ruta">Ruta</label><select id="ruta" required></select></div>
    </div>

    <label for="reportadoPor">Reportado por</label>
    <input id="reportadoPor" placeholder="Nombre del motorista o auxiliar" autocomplete="name" required>

    <label for="buscaSku">SKU averiado</label>
    <div id="zonaBusqueda">
      <div class="buscador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscaSku" type="search" placeholder="Busca por nombre o CODSAP…" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="lista-sku" id="listaSku" role="listbox"></div>
      <button type="button" class="link" id="noListado">¿No encuentras el SKU? Escríbelo a mano</button>
    </div>
    <div id="zonaManual" class="oculto">
      <input id="skuManual" placeholder="Nombre del producto tal como aparece en la caja">
      <button type="button" class="link" id="volverLista">← Volver a buscar en la lista</button>
    </div>
    <div id="skuElegido" class="elegido oculto">
      <div><b id="skuNombre"></b><span id="skuDetalle"></span></div>
      <button type="button" id="cambiarSku">Cambiar</button>
    </div>

    <label>¿Qué vas a reportar?</label>
    <div class="seg" id="unidadSeg" role="group" aria-label="Unidad"></div>

    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" min="1" step="1" inputmode="numeric" required>
    <div class="equiv" id="equiv"></div>

    <label for="motivo">Motivo de la avería</label>
    <select id="motivo" required></select>

    <label for="comentario">Comentario <span class="opc">(opcional)</span></label>
    <textarea id="comentario" placeholder="¿Qué pasó? Cliente, punto de la ruta, etc."></textarea>

    <label>Foto de evidencia <span class="opc">(recomendada)</span></label>
    <div class="foto-box" id="fotoBox">
      <img id="preview" class="oculto" alt="">
      <input type="file" id="foto" accept="image/*" capture="environment">
    </div>

    <div id="msg" class="msg"></div>
    <button type="submit" id="btn" style="margin-top:16px">Registrar avería</button>
  </form>

  <div id="ok" class="card exito oculto">
    <div class="check">✓</div>
    <div>Avería registrada</div>
    <div class="id" id="okId"></div>
    <div class="resumen" id="okResumen"></div>
    <button class="sec" id="otra" type="button">Registrar otra avería</button>
  </div>
</main>

<script>
  const CAT = <?!= catJson ?>;
  const $ = id => document.getElementById(id);

  function llenar(sel, items, placeholder) {
    sel.innerHTML = '<option value="">' + placeholder + '</option>' +
      items.map(v => '<option>' + v.replace(/</g, '&lt;') + '</option>').join('');
  }
  llenar($('ruta'), CAT.rutas, 'Elegir…');
  llenar($('motivo'), CAT.motivos, 'Elegir motivo…');

  /* ---------- Buscador de SKU ---------- */
  const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const SKUS = CAT.skus.map(([cod, nombre, cat, upc]) => ({ cod, nombre, cat, upc, txt: norm(cod + ' ' + nombre + ' ' + cat) }));
  const escH = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let SKU = null;          // SKU elegido de la lista
  let MANUAL = false;      // true si la ruta escribe un SKU no listado

  function resaltar(texto, palabras) {
    let h = escH(texto);
    palabras.forEach(p => {
      if (!p) return;
      const re = new RegExp('(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      h = h.replace(re, '<mark>$1</mark>');
    });
    return h;
  }

  function pintarLista() {
    const q = norm($('buscaSku').value.trim());
    const palabras = q.split(/\s+/).filter(Boolean);
    const res = palabras.length ? SKUS.filter(s => palabras.every(p => s.txt.includes(p))) : SKUS;
    if (!res.length) {
      $('listaSku').innerHTML = '<div class="info">Sin resultados para "' + escH($('buscaSku').value) + '". Prueba con otra palabra o con el CODSAP.</div>';
      return;
    }
    const pal = $('buscaSku').value.trim().split(/\s+/).filter(Boolean);
    let html = '', grupo = '';
    res.forEach(s => {
      if (s.cat !== grupo) { grupo = s.cat; html += '<div class="grupo">' + escH(grupo) + '</div>'; }
      html += '<button type="button" class="op" role="option" data-i="' + SKUS.indexOf(s) + '"><code>' +
              resaltar(s.cod, pal) + '</code><span>' + resaltar(s.nombre, pal) + '</span></button>';
    });
    $('listaSku').innerHTML = (palabras.length ? '<div class="info">' + res.length + ' resultado' + (res.length === 1 ? '' : 's') + '</div>' : '') + html;
  }

  let timer;
  $('buscaSku').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(pintarLista, 120); });
  $('listaSku').addEventListener('click', e => {
    const b = e.target.closest('.op'); if (!b) return;
    elegirSku(SKUS[Number(b.dataset.i)]);
  });

  function elegirSku(s) {
    SKU = s; MANUAL = false;
    $('skuNombre').textContent = s.cod + ' – ' + s.nombre;
    $('skuDetalle').textContent = s.cat + (s.upc > 1 ? ' · ' + s.upc + ' unidades por caja' : '');
    $('zonaBusqueda').classList.add('oculto'); $('zonaManual').classList.add('oculto');
    $('skuElegido').classList.remove('oculto');
    actualizarEquiv();
  }
  function reiniciarSku() {
    SKU = null; MANUAL = false; $('skuManual').value = '';
    $('skuElegido').classList.add('oculto'); $('zonaManual').classList.add('oculto');
    $('zonaBusqueda').classList.remove('oculto');
    $('buscaSku').value = ''; pintarLista(); actualizarEquiv();
  }
  $('cambiarSku').addEventListener('click', () => { reiniciarSku(); $('buscaSku').focus(); });
  $('noListado').addEventListener('click', () => {
    SKU = null; MANUAL = true;
    $('zonaBusqueda').classList.add('oculto'); $('zonaManual').classList.remove('oculto');
    $('skuManual').focus(); actualizarEquiv();
  });
  $('volverLista').addEventListener('click', reiniciarSku);
  pintarLista();

  /* ---------- Botón Cajas / Unidades ---------- */
  let UNIDAD = CAT.unidades[0] || 'Cajas';
  $('unidadSeg').innerHTML = CAT.unidades.map(u => '<button type="button" data-u="' + escH(u) + '">' + escH(u) + '</button>').join('');
  function marcarUnidad(u) {
    UNIDAD = u;
    $('unidadSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === u));
    $('cantidad').placeholder = '¿Cuántas ' + u.toLowerCase() + '?';
    actualizarEquiv();
  }
  $('unidadSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) marcarUnidad(b.dataset.u); });
  $('cantidad').addEventListener('input', actualizarEquiv);

  function actualizarEquiv() {
    const n = Number($('cantidad').value), u = UNIDAD.toLowerCase();
    let t = '';
    if (SKU && n > 0 && SKU.upc > 1) {
      if (u.startsWith('unidad')) t = '≈ ' + (Math.round(n / SKU.upc * 100) / 100) + ' cajas de ' + SKU.upc + ' unidades';
      else if (u.startsWith('caja')) t = '= ' + (n * SKU.upc) + ' unidades';
    }
    $('equiv').textContent = t;
  }
  marcarUnidad(UNIDAD);

  function hoy() {
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  $('fechaJornada').value = hoy();

  // Recordar ruta y nombre en este teléfono
  try {
    const g = JSON.parse(localStorage.getItem('averias_ruta') || '{}');
    if (g.ruta && CAT.rutas.includes(g.ruta)) $('ruta').value = g.ruta;
    if (g.nombre) $('reportadoPor').value = g.nombre;
  } catch (e) {}

  let fotoB64 = '';
  $('foto').addEventListener('change', async e => {
    const file = e.target.files[0];
    fotoB64 = '';
    if (!file) { $('preview').classList.add('oculto'); return; }
    try {
      fotoB64 = await comprimir(file);
      $('preview').src = 'data:image/jpeg;base64,' + fotoB64;
      $('preview').classList.remove('oculto');
    } catch (err) { mostrarError(err.message); }
  });

  function comprimir(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
      };
      img.onerror = () => rej(new Error('No se pudo leer la foto.'));
      img.src = url;
    });
  }

  function mostrarError(t) { $('msg').textContent = t; $('msg').className = 'msg err'; }

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    $('msg').className = 'msg';
    const d = {
      fechaJornada: $('fechaJornada').value, ruta: $('ruta').value, reportadoPor: $('reportadoPor').value.trim(),
      codsap: SKU ? SKU.cod : '', producto: SKU ? SKU.nombre : (MANUAL ? $('skuManual').value.trim() : ''),
      cantidad: $('cantidad').value, unidad: UNIDAD, motivo: $('motivo').value,
      comentario: $('comentario').value.trim(), fotoBase64: fotoB64
    };
    const faltan = [['ruta','la ruta'],['reportadoPor','quién reporta'],['producto','el SKU'],
                    ['cantidad','la cantidad'],['motivo','el motivo']].filter(([k]) => !d[k]);
    if (faltan.length) return mostrarError('Completa ' + faltan.map(x => x[1]).join(', ') + '.');
    if (!(Number(d.cantidad) > 0)) return mostrarError('La cantidad debe ser mayor que cero.');

    try { localStorage.setItem('averias_ruta', JSON.stringify({ ruta: d.ruta, nombre: d.reportadoPor })); } catch (e) {}

    $('btn').disabled = true; $('btn').textContent = 'Enviando…';
    google.script.run
      .withSuccessHandler(r => {
        $('btn').disabled = false; $('btn').textContent = 'Registrar avería';
        $('okId').textContent = r.id;
        $('okResumen').textContent = d.ruta + ' · ' + d.cantidad + ' ' + d.unidad.toLowerCase() + ' de ' +
          (d.codsap ? d.codsap + ' – ' : '') + d.producto + ' · ' + d.motivo;
        $('f').classList.add('oculto'); $('ok').classList.remove('oculto');
        window.scrollTo(0, 0);
      })
      .withFailureHandler(err => {
        $('btn').disabled = false; $('btn').textContent = 'Registrar avería';
        mostrarError('No se pudo registrar: ' + (err.message || err) + '. Revisa tu señal e inténtalo otra vez.');
      })
      .registrarAveria(d);
  });

  $('otra').addEventListener('click', () => {
    ['cantidad','comentario'].forEach(id => $(id).value = '');
    reiniciarSku();
    $('motivo').value = ''; $('foto').value = ''; fotoB64 = '';
    $('preview').classList.add('oculto');
    $('ok').classList.add('oculto'); $('f').classList.remove('oculto');
  });
</script>
</body>
</html>
