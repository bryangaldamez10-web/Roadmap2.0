{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="form-movil">
  <div class="titulo"><div><h1>Cambiar contraseña</h1>
    {% if usuario.debe_cambiar %}<p class="muted">Por seguridad, define tu propia contraseña antes de continuar.</p>{% endif %}</div></div>
  <form class="card" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="actual">Contraseña actual</label>
    <input id="actual" name="actual" type="password" autocomplete="current-password" required>
    <label for="nueva">Nueva contraseña</label>
    <input id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="8" required>
    <p class="small muted" style="margin:6px 0 0">Mínimo 8 caracteres, con letras y números.</p>
    <label for="confirmar">Confirmar nueva contraseña</label>
    <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required>
    <button class="btn bloque" style="margin-top:18px">Guardar contraseña</button>
  </form>
</div>
{% endblock %}
